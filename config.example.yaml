# pvs-monitor example configuration
# Copy to ~/.config/pvs-monitor/config.yaml and adjust for your system.

# PVS6 WebSocket address (ws://your-pvs6-ip:9002)
addr: ws://YOUR-PVS6-IP:9002

# Reconnect backoff settings
reconnect_initial_interval: 1s
reconnect_max_interval: 30s

# Error if no reading has arrived within this window.
# Keep this above reconnect_max_interval: a reconnect can take that long, and a
# shorter threshold reports stale data while the monitor is recovering normally.
# The PVS6 pushes readings at 1s, so 60s is ~60x the cadence and still catches a
# genuine telemetry stall within a minute.
stale_threshold: 60s

# IANA timezone of the site where the PVS6 is installed (e.g. "America/Los_Angeles").
# pvs-ui uses this to bucket and label charts by the site's calendar day, so
# "Today" always means the site's day — regardless of which timezone the
# dashboard is being viewed from. Auto-detected from the host running
# pvs-monitor if left unset; set it explicitly if pvs-monitor doesn't run on
# the same site as the PVS6.
# timezone: America/Los_Angeles

# Device list HTTP poller (optional — provides per-device data)
# Leave password empty to disable.
device_list:
  url: http://YOUR-PVS6-IP     # must match the IP from addr above
  interval: 60s
  username: ssm_owner
  password: ""                   # last 5 characters of your PVS serial number
  # tls_fingerprint pins the PVS6 TLS certificate (SHA-256, colons optional).
  # Obtain with: openssl s_client -connect your-pvs6-ip:443 </dev/null 2>/dev/null \
  #   | openssl x509 -noout -fingerprint -sha256
  # When set, MITM attacks are detected even though the cert is self-signed.
  # tls_fingerprint: "AA:BB:CC:..."
