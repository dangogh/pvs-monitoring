name: Bump Version

# Manually tap "Run workflow" (bump defaults to patch) to cut the next
# release without a local git checkout: this pushes the next vX.Y.Z tag and
# explicitly dispatches release.yml for it. The dispatch is necessary: a
# push made with the default GITHUB_TOKEN does not trigger other workflows'
# push events (GitHub's anti-recursion rule), so release.yml would never
# see this tag land on its own.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increment'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create and push the next version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          IFS='.' read -r major minor patch <<< "$latest"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"
          echo "Latest tag: v${latest:-none} -> next: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Trigger the release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
