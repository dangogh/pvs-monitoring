name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install JS deps
        run: npm ci
      - name: Go tests (race + coverage)
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep '^total:'
      - name: JS tests
        run: npm test

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Install the same golangci-lint version used locally (make lint). Pinned
      # rather than via golangci-lint-action so CI matches local exactly: the
      # repo lints clean on v1.x with default config, and v2 changed the
      # defaults and config schema.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.64.8/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
      - name: Lint
        run: golangci-lint run
