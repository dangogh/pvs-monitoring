# Friendly mDNS name for the solar dashboard.
#
# With UI_ALIAS=solar the dashboard is reachable on the LAN at
# http://solar.local (the host itself is not renamed). Change it to any name
# you like, or leave it empty to disable the alias — the box is always still
# reachable at http://<hostname>.local.
#
# Apply changes with: sudo systemctl restart pvs-ui-alias
UI_ALIAS=solar
